map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

map $http_x_forwarded_proto $linhub_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

upstream linhub_app {
  server 127.0.0.1:3006;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  listen 8443 ssl default_server;
  listen [::]:8443 ssl default_server;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/lin.wenzhuolin.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lin.wenzhuolin.xyz/privkey.pem;
  return 444;
}

server {
  listen 80;
  listen [::]:80;
  server_name lin.wenzhuolin.xyz;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/linhub-proxy.conf;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  listen 8443 ssl http2;
  listen [::]:8443 ssl http2;
  server_name lin.wenzhuolin.xyz;

  ssl_certificate /etc/letsencrypt/live/lin.wenzhuolin.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lin.wenzhuolin.xyz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:LinHubSSL:10m;
  ssl_session_timeout 1d;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/linhub-proxy.conf;
  }
}
