<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1110" />
    <title>灵枢 · 当前离线</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #0b1110;
        color: #f7faf9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 20%, rgb(30 156 137 / 18%), transparent 38%),
          #0b1110;
      }
      main {
        width: min(420px, 100%);
        padding: 32px;
        border: 1px solid rgb(127 216 196 / 22%);
        border-radius: 24px;
        background: rgb(16 24 23 / 92%);
        text-align: center;
      }
      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border: 2px solid #7fd8c4;
        border-radius: 18px;
        color: #7fd8c4;
        font-size: 26px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: #98a2b3;
        line-height: 1.7;
      }
      button {
        margin-top: 24px;
        padding: 10px 18px;
        border: 0;
        border-radius: 12px;
        background: #1e9c89;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">灵</div>
      <h1>当前无法连接网络</h1>
      <p>请检查网络连接后重试。你的对话和设置不会因为这个页面而被清除。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
