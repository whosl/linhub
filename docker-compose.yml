services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: linhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linhub
      POSTGRES_PASSWORD: linhub_dev_password
      POSTGRES_DB: linhub
    ports:
      - "5433:5432"
    volumes:
      - linhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 生产部署时启用 app 服务（本地开发用 npm run dev）
  # app:
  #   build: .
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URL: postgres://linhub:linhub_dev_password@postgres:5432/linhub
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  linhub-pgdata:
